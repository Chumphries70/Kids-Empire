const STORAGE_KEY='kids-empire-pwa-current-v2';let filters={complete:false,notstarted:false,progress:false,notes:false};let dirty=false;
function blankItem(e,custom){return Object.assign({},e,{status:e.responseType==='yesno'?{Yes:false,No:false}:{Complete:false,'Not Started':false},percent:e.responseType==='yesno'?undefined:'',notes:'',custom:!!custom})}
function fresh(){return {meta:{projectName:'',reviewedBy:'',reviewDate:new Date().toISOString().slice(0,10)},sections:JSON.parse(JSON.stringify(BASE)).map(function(s){s.entries=s.entries.map(function(e){return e.type==='item'?blankItem(e,false):e});return s})}}
function normalizeLoaded(x){
 if(!x||!Array.isArray(x.sections))return fresh();
 var clean=fresh();
 clean.meta=Object.assign(clean.meta,x.meta||{});
 clean.sections=clean.sections.map(function(sec){
  var oldSec=x.sections.find(function(s){return s&&s.num===sec.num});
  if(!oldSec||!Array.isArray(oldSec.entries))return sec;
  sec.entries=sec.entries.map(function(e){
   if(e.type!=='item')return e;
   var old=oldSec.entries.find(function(o){return o&&o.type==='item'&&o.id===e.id});
   var item=blankItem(e,false);
   if(!old)return item;
   item.notes=typeof old.notes==='string'?old.notes:'';
   if(item.responseType==='yesno'){
    item.status.Yes=!!(old.status&&old.status.Yes);item.status.No=!!(old.status&&old.status.No);
   }else{
    item.status.Complete=!!(old.status&&old.status.Complete);item.status['Not Started']=!!(old.status&&old.status['Not Started']);
    item.percent=(old.percent===undefined||old.percent===null)?'':String(old.percent);
   }
   return item;
  });

  return sec;
 });
 return clean;
}
function loadState(){try{var x=JSON.parse(localStorage.getItem(STORAGE_KEY));return normalizeLoaded(x)}catch(e){return fresh()}}
let state=loadState();
function persist(markDirty){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}if(markDirty){dirty=true;setMsg('Changes stored on this device — tap Save Inspection to mark complete.')}}
function saveInspection(){persist(false);dirty=false;setMsg('Inspection saved on this device at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));}
function setMsg(s){document.getElementById('statusmsg').textContent=s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function items(sec){return sec.entries.filter(function(e){return e.type==='item'})}function pct(i){return i.responseType==='yesno'||i.percent===''||i.percent==null?null:Number(i.percent)}function isComplete(i){return i.responseType!=='yesno'&&(i.status.Complete||pct(i)===100)}function isNotStarted(i){return i.responseType!=='yesno'&&(i.status['Not Started']||pct(i)===0)}function isProgress(i){var p=pct(i);return i.responseType!=='yesno'&&p!==null&&p>0&&p<100}function answered(i){return i.responseType==='yesno'?(i.status.Yes||i.status.No):(isComplete(i)||isNotStarted(i)||isProgress(i))}function unanswered(){var a=[];state.sections.forEach(function(s){items(s).forEach(function(i){if(!answered(i))a.push(i.id)})});return a}
function matches(i){var active=Object.keys(filters).filter(function(k){return filters[k]});if(!active.length)return true;return active.every(function(f){return f==='complete'?isComplete(i):f==='notstarted'?isNotStarted(i):f==='progress'?isProgress(i):!!String(i.notes||'').trim()})}
function normalizePercent(v){var x=String(v).trim();if(x==='')return '';if(!/^\d{1,3}$/.test(x))return null;var n=Number(x);if(!Number.isInteger(n)||n<0||n>100)return null;return String(n)}
function nextId(sec){var n=1;while(items(sec).some(function(x){return x.id===sec.num+'x'+n}))n++;return sec.num+'x'+n}
function newItem(sec,text){var yesno=sec.num==='I';return blankItem({type:'item',id:nextId(sec),text:text,responseType:yesno?'yesno':undefined},true)}
function showError(msg){var e=document.getElementById('error');e.textContent=msg;e.classList.remove('hidden');e.scrollIntoView({behavior:'smooth',block:'center'})}function clearError(){document.getElementById('error').classList.add('hidden')}
function render(){document.getElementById('projectName').value=state.meta.projectName||'';document.getElementById('reviewedBy').value=state.meta.reviewedBy||'';document.getElementById('reviewDate').value=state.meta.reviewDate||'';var root=document.getElementById('content');root.innerHTML='';var total=0,ans=0,complete=0,progress=0,notstarted=0,yes=0,no=0;state.sections.forEach(function(sec,si){var list=items(sec);total+=list.length;ans+=list.filter(answered).length;complete+=list.filter(isComplete).length;progress+=list.filter(isProgress).length;notstarted+=list.filter(isNotStarted).length;yes+=list.filter(function(i){return i.responseType==='yesno'&&i.status.Yes}).length;no+=list.filter(function(i){return i.responseType==='yesno'&&i.status.No}).length;if(Object.keys(filters).some(function(k){return filters[k]})&&!list.some(matches))return;var el=document.createElement('section');el.className='section';el.innerHTML='<div class="section-head"><span>'+esc(sec.num)+'. '+esc(sec.title)+'</span>'+(list.length&&list.every(answered)?'<span class="resolved">Answered</span>':'')+'</div><div class="control-head"><span></span><div class="labels">'+(sec.num==='I'?'<span>Yes</span><span>No</span><span></span>':'<span>Complete</span><span>Not Started</span><span class="pct-head">% Complete</span>')+'</div></div>';var current=null;sec.entries.forEach(function(e,ei){if(e.type==='subsection'){current=document.createElement('div');current.className='subsection';current.textContent=e.title;el.appendChild(current);return}if(!matches(e))return;var row=document.createElement('div');row.className='row';var controls;if(e.responseType==='yesno'){controls='<div class="controls"><label class="choice"><input type="checkbox" data-kind="status" data-key="Yes" data-si="'+si+'" data-ei="'+ei+'" '+(e.status.Yes?'checked':'')+'>Yes</label><label class="choice"><input type="checkbox" data-kind="status" data-key="No" data-si="'+si+'" data-ei="'+ei+'" '+(e.status.No?'checked':'')+'>No</label></div>'}else{controls='<div class="controls"><label class="choice"><input type="checkbox" data-kind="status" data-key="Complete" data-si="'+si+'" data-ei="'+ei+'" '+(e.status.Complete?'checked':'')+'>Complete</label><label class="choice"><input type="checkbox" data-kind="status" data-key="Not Started" data-si="'+si+'" data-ei="'+ei+'" '+(e.status['Not Started']?'checked':'')+'>Not Started</label><label class="pct"><input type="number" inputmode="numeric" min="0" max="100" step="1" data-kind="percent" data-si="'+si+'" data-ei="'+ei+'" value="'+esc(e.percent)+'"><span class="pct-symbol">%</span></label></div>'}row.innerHTML='<div class="q"><span class="qid">'+esc(e.id)+'.</span><span>'+esc(e.text)+'</span></div><div>'+controls+'</div><div class="notes"><label>Notes</label><textarea data-kind="notes" data-si="'+si+'" data-ei="'+ei+'">'+esc(e.notes)+'</textarea></div>'+(e.custom?'<div class="actions"><button class="mini" data-action="rename" data-si="'+si+'" data-ei="'+ei+'">Rename</button><button class="mini" data-action="delete" data-si="'+si+'" data-ei="'+ei+'">Delete</button></div>':'');el.appendChild(row)});var add=document.createElement('div');add.className='row actions';add.innerHTML='<button class="mini" data-action="addrow" data-si="'+si+'">+ Add Row</button><button class="mini" data-action="addsub" data-si="'+si+'">+ Add Subsection with Row</button>';el.appendChild(add);root.appendChild(el)});document.getElementById('summary').textContent=complete+' complete • '+progress+' in progress • '+notstarted+' not started • '+yes+' yes • '+no+' no • '+(total-ans)+' unanswered • '+total+' items'}
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.kind==='status'){var i=state.sections[+t.dataset.si].entries[+t.dataset.ei],k=t.dataset.key;i.status[k]=t.checked;if(i.responseType==='yesno'){if(t.checked&&k==='Yes')i.status.No=false;if(t.checked&&k==='No')i.status.Yes=false}else{if(t.checked&&k==='Complete'){i.status['Not Started']=false;i.percent='100'}if(t.checked&&k==='Not Started'){i.status.Complete=false;i.percent='0'}}persist(true);render()}else if(t.dataset.kind==='percent'){var i=state.sections[+t.dataset.si].entries[+t.dataset.ei],v=normalizePercent(t.value);if(v===null){showError('Enter a whole number from 0 to 100.');render();return}i.percent=v;var p=pct(i);i.status.Complete=p===100;i.status['Not Started']=p===0;persist(true);render()}else if(t.id==='reviewDate'){state.meta.reviewDate=t.value;persist(true)}})
document.addEventListener('input',function(e){var t=e.target;if(t.id==='projectName'){state.meta.projectName=t.value;persist(true)}else if(t.id==='reviewedBy'){state.meta.reviewedBy=t.value;persist(true)}else if(t.dataset.kind==='notes'){state.sections[+t.dataset.si].entries[+t.dataset.ei].notes=t.value;persist(true)}})
document.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;var sec=state.sections[+b.dataset.si],a=b.dataset.action;if(a==='addrow'){var text=prompt('New checklist item:');if(text){sec.entries.push(newItem(sec,text));persist(true);render()}}if(a==='addsub'){var name=prompt('New subsection name:');if(!name)return;var text=prompt('First checklist item:');if(text){sec.entries.push({type:'subsection',title:name,custom:true});sec.entries.push(newItem(sec,text));persist(true);render()}}if(a==='rename'){var i=sec.entries[+b.dataset.ei],v=prompt('Rename checklist item:',i.text);if(v){i.text=v;persist(true);render()}}if(a==='delete'&&confirm('Delete this added row?')){sec.entries.splice(+b.dataset.ei,1);persist(true);render()}})
document.querySelectorAll('.filter').forEach(function(b){b.addEventListener('click',function(){clearError();var turning=!filters[b.dataset.filter];if(turning){var miss=unanswered();if(miss.length){showError('Status required before filtering. '+miss.length+' unanswered: '+miss.join(', ')+'. You may still save a partially completed inspection.');return}}filters[b.dataset.filter]=turning;b.classList.toggle('active',turning);render()})});document.getElementById('clearFilters').onclick=function(){filters={complete:false,notstarted:false,progress:false,notes:false};document.querySelectorAll('.filter').forEach(function(b){b.classList.remove('active')});clearError();render()};document.getElementById('saveBottom').onclick=saveInspection;document.getElementById('addSection').onclick=function(){var title=prompt('New section name:');if(!title)return;var text=prompt('First checklist item:');if(!text)return;var last=state.sections[state.sections.length-1].num||'@',n=String.fromCharCode(last.charCodeAt(0)+1),sec={num:n,title:title,entries:[]};sec.entries.push(newItem(sec,text));state.sections.push(sec);persist(true);render()};document.getElementById('newInspection').onclick=function(){if(confirm('Start a new blank inspection? Current saved device data will be replaced.')){state=fresh();persist(false);dirty=false;render();setMsg('New blank inspection')}};
document.getElementById('exportJson').onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Kids Empire Inspection Backup - '+(state.meta.projectName||'Project')+' - '+(state.meta.reviewDate||'date')+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};document.getElementById('importBtn').onclick=function(){document.getElementById('importJson').click()};document.getElementById('importJson').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.sections)throw 0;state=x;persist(true);render();setMsg('Backup imported')}catch(err){showError('That file is not a valid checklist backup.')}};r.readAsText(f)};
window.addEventListener('beforeunload',function(e){if(!dirty)return;e.preventDefault();e.returnValue=''});if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js').catch(function(){})})}if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){document.getElementById('installHint').classList.add('hidden')}try{render();setMsg('Ready — data is stored locally on this device.')}catch(err){showError('The checklist could not initialize. Reload the app. If this persists, use New Blank Inspection after the page reloads.');setMsg('Initialization error');console.error(err)};
</script></body></html>
